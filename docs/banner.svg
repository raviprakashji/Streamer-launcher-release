<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="1280" height="720">
  <defs>
    <filter id="glow-left" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
    </filter>
    <filter id="glow-right" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
    </filter>
  </defs>

  <!-- Background: Deep Cinematic Obsidian -->
  <rect width="320" height="180" fill="#0D1117" />

  <!-- Ambient Glow / Backdrop Accents -->
  <rect x="16" y="12" width="288" height="156" rx="12" fill="#151C28" stroke="#1F293D" stroke-width="1.5" />

  <!-- Ambient Neon Flares -->
  <!-- Violet ambient glow on left -->
  <rect x="30" y="30" width="120" height="120" rx="20" fill="#7C4DFF" fill-opacity="0.10" filter="url(#glow-left)" />

  <!-- Cyan ambient glow on right -->
  <rect x="170" y="30" width="120" height="120" rx="20" fill="#00E5FF" fill-opacity="0.10" filter="url(#glow-right)" />

  <!-- Group: Central Streaming Icon -->
  <!-- Stream Waves / Broadcast Arcs on Right of Play Emblem -->
  <path d="M188,60 A40,40 0 0,1 188,120" fill="none" stroke="#00E5FF" stroke-opacity="0.15" stroke-width="4" stroke-linecap="round" />
  <path d="M198,52 A52,52 0 0,1 198,128" fill="none" stroke="#00E5FF" stroke-opacity="0.31" stroke-width="3.5" stroke-linecap="round" />
  <path d="M208,44 A64,64 0 0,1 208,136" fill="none" stroke="#7C4DFF" stroke-opacity="0.56" stroke-width="3" stroke-linecap="round" />

  <!-- Main Emblem Hex / Rounded Shield Backdrop -->
  <path d="M136,44 l40,23 a8,8 0 0,1 4,7 v32 a8,8 0 0,1 -4,7 l-40,23 a8,8 0 0,1 -8,0 l-40,-23 a8,8 0 0,1 -4,-7 v-32 a8,8 0 0,1 4,-7 l40,-23 a8,8 0 0,1 8,0 z" fill="#1B2232" stroke="#2F3B54" stroke-width="2" />

  <!-- Dynamic Streaming Play Facets (overlapping jewel/prism planes) -->
  <!-- Top-Right Facet (Vivid Cyan) -->
  <path d="M122,62 L158,86 L134,90 Z" fill="#00E5FF" />

  <!-- Bottom Facet (Electric Violet / Purple) -->
  <path d="M122,118 L134,90 L158,86 Z" fill="#7C4DFF" />

  <!-- Left Facet (Neon Magenta / Coral) -->
  <path d="M122,62 L134,90 L122,118 Z" fill="#FF4081" />

  <!-- Central Luminous Core (Crisp White / Silver core play highlight) -->
  <path d="M128,74 L148,88 a2,2 0 0,1 0,3.5 L128,104 a2,2 0 0,1 -3,-1.7 V75.7 a2,2 0 0,1 3,-1.7 z" fill="#FFFFFF" />

  <!-- Subtle inner core shadow for 3D depth -->
  <path d="M125,90 L148,88 L128,104 Z" fill="#000000" fill-opacity="0.125" />

  <!-- Bottom Wordmark Accent: Sleek 'STREAMER' pill / indicator -->
  <rect x="120" y="146" width="80" height="4" rx="2" fill="#242E42" />
  <rect x="145" y="146" width="30" height="4" rx="2" fill="#00E5FF" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1A2234" />
      <stop offset="100%" stop-color="#0B0E14" />
    </radialGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222B3E" />
      <stop offset="100%" stop-color="#161B27" />
    </linearGradient>
    <radialGradient id="neon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#7C4DFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="core-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern App Icon Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#222C3D" stroke-width="3" />

  <!-- Radial ambient back-light -->
  <circle cx="256" cy="256" r="190" fill="url(#neon-glow)" />

  <!-- Transformed emblem & broadcast waves centered at (256, 256) -->
  <!-- Original center was (148, 90). Scale ~ 2.6 -> offset: 256 - 148*2.6 = -128.8, 256 - 90*2.6 = 22 -->
  <g transform="translate(256, 256) scale(2.6) translate(-148, -90)">
    <!-- Stream Waves / Broadcast Arcs -->
    <path d="M188,60 A40,40 0 0,1 188,120" fill="none" stroke="#00E5FF" stroke-opacity="0.25" stroke-width="4.5" stroke-linecap="round" />
    <path d="M198,52 A52,52 0 0,1 198,128" fill="none" stroke="#00E5FF" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round" />
    <path d="M208,44 A64,64 0 0,1 208,136" fill="none" stroke="#7C4DFF" stroke-opacity="0.75" stroke-width="3.5" stroke-linecap="round" />

    <!-- Hex Shield Backdrop -->
    <path d="M136,44 l40,23 a8,8 0 0,1 4,7 v32 a8,8 0 0,1 -4,7 l-40,23 a8,8 0 0,1 -8,0 l-40,-23 a8,8 0 0,1 -4,-7 v-32 a8,8 0 0,1 4,-7 l40,-23 a8,8 0 0,1 8,0 z" fill="url(#shield-grad)" stroke="#384563" stroke-width="2.5" />

    <!-- Play Facets -->
    <path d="M122,62 L158,86 L134,90 Z" fill="#00E5FF" />
    <path d="M122,118 L134,90 L158,86 Z" fill="#7C4DFF" />
    <path d="M122,62 L134,90 L122,118 Z" fill="#FF4081" />

    <!-- Central White Play Core -->
    <path d="M128,74 L148,88 a2,2 0 0,1 0,3.5 L128,104 a2,2 0 0,1 -3,-1.7 V75.7 a2,2 0 0,1 3,-1.7 z" fill="#FFFFFF" />
    <path d="M125,90 L148,88 L128,104 Z" fill="#000000" fill-opacity="0.14" />
  </g>
</svg>